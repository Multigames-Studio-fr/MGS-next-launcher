<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0f1724"/>
      <stop offset="1" stop-color="#1f2937"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend mode="overlay" in2="SourceGraphic"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#g)" />
  <g opacity="0.06">
    <rect width="100%" height="100%" fill="#FF6A1A" transform="translate(-200,0) rotate(10 960 540)"/>
    <rect width="100%" height="100%" fill="#F8BA59" transform="translate(200,0) rotate(-8 960 540)"/>
  </g>
  <g opacity="0.08" transform="translate(-60,0)">
    <circle cx="300" cy="220" r="8" fill="#F8BA59" />
    <circle cx="1600" cy="320" r="6" fill="#fff" />
    <circle cx="900" cy="760" r="9" fill="#FF6A1A" />
  </g>
</svg>
